spring.application.name=banking-system

spring.datasource.url=jdbc:postgresql://localhost:5432/banking_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080
management.endpoints.web.exposure.include=health,mappings

# ── HikariCP connection pool configuration ───────────────────────────────────
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Transaction thread pool configuration ────────────────────────────────────
# Core threads kept alive permanently
banking.executor.core-pool-size=5
# Maximum number of worker threads (spun up when queue is full)
banking.executor.max-pool-size=20
# Bounded queue capacity — tasks beyond this are rejected
banking.executor.queue-capacity=500
# Idle non-core thread expiry (seconds)
banking.executor.keep-alive-seconds=60
# Max seconds to wait for in-flight tasks on graceful shutdown
banking.executor.shutdown-timeout-seconds=30
# Worker thread name prefix (shows in logs and stack traces)
banking.executor.thread-name-prefix=txn-worker-