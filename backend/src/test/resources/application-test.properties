# Isolated PostgreSQL test database configuration (never points to banking_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_test_db
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/ddl/001_create_customers.sql,file:../database/ddl/002_create_accounts.sql,file:../database/ddl/003_create_transactions.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── HikariCP connection pool configuration for concurrency / benchmark ────────
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Thread pool — small values for deterministic testing ─────────────────────
banking.executor.core-pool-size=4
banking.executor.max-pool-size=8
banking.executor.queue-capacity=100
banking.executor.keep-alive-seconds=10
banking.executor.shutdown-timeout-seconds=10
banking.executor.thread-name-prefix=test-txn-worker-
