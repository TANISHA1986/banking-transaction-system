# Isolated PostgreSQL test database configuration (never points to banking_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_test_db
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/ddl/001_create_customers.sql,file:../database/ddl/002_create_accounts.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
